name: apply-integration

on:
  workflow_dispatch:
  push:
    branches:
      - ci/apply
    paths:
      - .github/workflows/apply-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: fix/oot-88
          path: repo
          fetch-depth: 0
      - name: Build 21 on upstream nx2 9fa4a71f
        working-directory: repo
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = fbb8d70723d21ec7a99d15cd682e2aab10a6a144
          git update-ref refs/heads/fork_tip HEAD
          base64 -d ../ci/meshpoints21.patch.xz.b64 | xz -d > "$RUNNER_TEMP/meshpoints21.patch"
          PATCH_DIR="$RUNNER_TEMP" bash ../ci/build21.sh
          test "$(git rev-parse 'HEAD^{tree}')" = ce1495ba7ed8cd6f37d65c2f7d4c9dd2933ec7bb
          git merge-base --is-ancestor fbb8d70723d21ec7a99d15cd682e2aab10a6a144 HEAD
          git push origin HEAD:fix/oot-88
