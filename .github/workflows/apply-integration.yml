name: apply-integration

on:
  workflow_dispatch:
  push:
    branches:
      - ci/apply
    paths:
      - .github/workflows/apply-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: fix/oot-88
          path: repo
          fetch-depth: 0
      - name: Build 25 on upstream nx2 d2eaae4f
        working-directory: repo
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = b2cb14936864af0594be8c98ccc21a2ab2fa9b00
          git update-ref refs/heads/fork_tip HEAD
          bash ../ci/build25.sh
          test "$(git rev-parse 'HEAD^{tree}')" = ce98a4ce50b4f7517cabcd40e578ef09e6b27b7c
          git merge-base --is-ancestor b2cb14936864af0594be8c98ccc21a2ab2fa9b00 HEAD
          git push origin HEAD:fix/oot-88
