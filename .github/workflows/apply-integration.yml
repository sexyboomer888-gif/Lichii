name: apply-integration

on:
  workflow_dispatch:
  push:
    branches:
      - ci/apply
    paths:
      - .github/workflows/apply-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: fix/oot-88
          path: repo
          fetch-depth: 0
      - name: Build 26 on upstream nx2 17baed71
        working-directory: repo
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = 6300c36e6424b806082d047f4c0c0e7e603ce4d9
          git update-ref refs/heads/fork_tip HEAD
          bash ../ci/build26.sh
          test "$(git rev-parse 'HEAD^{tree}')" = d7014e54f5f536c98147ef898b923d62df2e9516
          git merge-base --is-ancestor 6300c36e6424b806082d047f4c0c0e7e603ce4d9 HEAD
          git push origin HEAD:fix/oot-88
