name: apply-integration

on:
  workflow_dispatch:
  push:
    branches:
      - ci/apply
    paths:
      - .github/workflows/apply-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: fix/oot-88
          path: repo
          fetch-depth: 0
      - name: Merge upstream nx2 and apply the build 20 series
        working-directory: repo
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = 2aec3f5d9a164d3d447a247e8dc01b7fa7314e2b
          upstream=https://github.com/zortos293/lichii
          git fetch "$upstream" 588bfa611be9853729682dd78416c66e8d56385a
          git merge --no-ff -m "Merge upstream nx2 (588bfa61): compute write ordering and misaligned SSBO accesses (#295), AV1 in MinGW (#284), ThreadWorker wake (#290)" FETCH_HEAD
          # The token can't push workflow changes: keep this fork's workflow files.
          git checkout HEAD^1 -- .github
          git commit --amend --no-edit
          test "$(git rev-parse 'HEAD^{tree}')" = e4daa84c86344f076a0c21dc45df48c358e70e46
          base64 -d ../ci/series20.patch.xz.b64 | xz -d > "$RUNNER_TEMP/series20.patch"
          git am -C2 --keep-cr "$RUNNER_TEMP/series20.patch"
          test "$(git rev-parse 'HEAD^{tree}')" = 1ac049bae6b6bd75202a8e8dc13ef1b7de2050f1
          git push origin HEAD:fix/oot-88
