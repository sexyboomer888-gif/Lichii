name: apply-integration

on:
  workflow_dispatch:
  push:
    branches:
      - ci/apply
    paths:
      - .github/workflows/apply-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: fix/oot-88
          path: repo
          fetch-depth: 0
      - name: Build 22 on upstream nx2 65e979ad
        working-directory: repo
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = f3523bbf2638d916447891b58eaf69d9f94ec831
          git update-ref refs/heads/fork_tip HEAD
          bash ../ci/build22.sh
          test "$(git rev-parse 'HEAD^{tree}')" = 8c210377bb643fbf40e853cbda4af65fa8833544
          git merge-base --is-ancestor f3523bbf2638d916447891b58eaf69d9f94ec831 HEAD
          git push origin HEAD:fix/oot-88
