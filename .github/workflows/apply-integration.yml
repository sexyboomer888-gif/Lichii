name: apply-integration

on:
  workflow_dispatch:
  push:
    branches:
      - ci/apply
    paths:
      - .github/workflows/apply-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: fix/oot-88
          path: repo
          fetch-depth: 0
      - name: Build 24 on upstream nx2 794602bf
        working-directory: repo
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = 0802e42fc214bd29c759e36326e8d855e4a7747c
          git update-ref refs/heads/fork_tip HEAD
          bash ../ci/build24.sh
          test "$(git rev-parse 'HEAD^{tree}')" = 3881e828cbf58dd5185a5bcdca573c2cc7a3d3e8
          git merge-base --is-ancestor 0802e42fc214bd29c759e36326e8d855e4a7747c HEAD
          git push origin HEAD:fix/oot-88
